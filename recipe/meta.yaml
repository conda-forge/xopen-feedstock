{% set name = "xopen" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 06584821588f813563863b63d5e02568a4328661b7507ea38c432f24c69ea4b7

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - python-isal >=1.6.1
    - python-zlib-ng >=0.4.1
    - pigz
    - pbzip2  # [not win]
    - backports.zstd
    - zstd
    - __unix   # [unix]
    - __win    # [win]

test:
  requires:
    - python {{ python_min }}
  imports:
    - xopen

about:
  home: https://github.com/pycompression/xopen/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Open compressed files transparently in Python
  doc_url: https://github.com/pycompression/xopen/
  dev_url: https://github.com/pycompression/xopen/

extra:
  recipe-maintainers:
    - corneliusroemer
    - marcelm
    - rhpvorderman
